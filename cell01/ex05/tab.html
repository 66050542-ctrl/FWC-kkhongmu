<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exercise 05</title>
    <style>
        table {
            width: 100%;
            height: 200px;
            border-collapse: collapse;
        }

        td {
            text-align: center;
            font-size: 24px;
            border: 2px solid black;
        }

        .box1 {
            background-color: lightblue;
        }

        .box2 {
            background-color: lightpink;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td class="box1">Hello</td>
            <td class="box2">World</td>
        </tr>
    </table>
</body>
</html>
