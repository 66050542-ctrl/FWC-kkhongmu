<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css">
</head>

<body>

    <div class="calculator">
        <h1>Calculator</h1>

        <input type="text" id="left" placeholder="First number">

        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>

        <input type="text" id="right" placeholder="Second number">

        <input type="submit" id="tryme" value="Try me!">
    </div>

    <script src="calc.js"></script>
</body>
